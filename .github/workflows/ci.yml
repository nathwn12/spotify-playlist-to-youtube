# nathwn12 house CI - stack: python.
# Drift from the house ci-python template: this repo has no pytest; its gate is
# acceptance.cmd, so the job runs every check that gate runs.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -X utf8 tests/acceptance.py
      - run: python -X utf8 tests/check_page.py
      - run: python -X utf8 tests/test_cookies.py
      - run: python -X utf8 tests/test_connect_card.py
      - run: python -X utf8 tests/check_release_assets.py
