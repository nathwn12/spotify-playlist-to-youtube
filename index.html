<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sp2yt — keyless spotify→ytmusic (personal use)</title>
<style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;max-width:720px;margin:32px auto;padding:0 20px;background:radial-gradient(1200px 400px at 50% -80px,#1f5133 0%,#141417 60%);color:#e8e8ea;line-height:1.45;min-height:100vh}
h2{margin:0 0 4px;font-size:22px;letter-spacing:.2px}
h2 .dot{color:#1db954}
p.sub{color:#a9a9b2;margin:0 0 20px;font-size:14px}
.card{background:rgba(29,29,34,.96);border:1px solid #2c2c34;border-radius:12px;padding:16px;margin:0 0 14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
h2{margin:0 0 4px;font-size:22px}
p.sub{color:#a9a9b2;margin:0 0 20px;font-size:14px}
.card{background:#1d1d22;border:1px solid #2c2c34;border-radius:10px;padding:16px;margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;color:#cfcfd8;margin:12px 0 6px}
label:first-child{margin-top:0}
.hint{font-weight:400;color:#8e8e98;font-size:12px}
input[type=text],input:not([type]),textarea,select{width:100%;max-width:100%;padding:9px 10px;margin:0;background:#101014;color:#e8e8ea;border:1px solid #3a3a44;border-radius:7px;font-size:13px}
textarea{display:block;resize:vertical;min-height:56px;overflow:auto}
input[type=file]{width:100%;max-width:100%;margin:8px 0 0;padding:0;font-size:12px;color:#a9a9b2;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:12px}
.row>div{flex:1;min-width:0}
.btns{display:flex;gap:10px;margin:14px 0}
button{flex:1;padding:12px;font-size:15px;font-weight:700;border:0;border-radius:10px;cursor:pointer;transition:transform .06s,filter .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.98)}
button:disabled{filter:grayscale(.6) brightness(.7);cursor:wait}
#go{background:linear-gradient(180deg,#23d664,#159a46);color:#fff;box-shadow:0 4px 16px rgba(29,185,84,.35)}
#step1{background:#33333b;color:#fff;flex:0 0 190px}
#log{background:#0c0f0c;color:#7dffa8;border:1px solid #2c2c34;border-radius:8px;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:300px;overflow-y:auto;overflow-x:hidden;margin:10px 0 0}
#progrow{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;color:#ffd866;margin:0}
#spin{width:14px;height:14px;flex:0 0 14px;border:2px solid #3a3a44;border-top-color:#1db954;border-radius:50%;display:none}
#spin.on{display:inline-block;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#bar{height:10px;background:#101014;border:1px solid #3a3a44;border-radius:6px;overflow:hidden;margin:8px 0 0}
#fill{height:100%;width:0%;background:#1db954;transition:width .3s}
#bar.live #fill{background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:16px 16px;animation:slide .6s linear infinite}
@keyframes slide{to{background-position:16px 0}}
</style></head><body>
<h2><span class="dot">●</span> sp2yt — 1-click, keyless, cookies are yours</h2>
<p class="sub">Paste playlist + your cookies. Nothing leaves your machine except direct Spotify / YT Music calls.</p>
<div class="card">
<label>Spotify playlist URL</label>
<input id="sp_url" value="https://open.spotify.com/playlist/3Tz2V0H4uEWtpA4YcBHNfo?si=6f65637dc4c04146">
<label>Load cookies <span class="hint">(one upload — select both .txt files, auto-sorts Spotify vs YouTube)</span></label>
<input type="file" id="cookie_files" accept=".txt,text/plain,*/*" multiple>
<label>Spotify cookie <span class="hint">(optional — auto-filled from upload, or type)</span></label>
<textarea id="sp_cookie" rows="2" placeholder="sp_dc=...; sp_key=... (optional)"></textarea>
<label>YouTube Music cookie <span class="hint">(needed to create playlist — auto-filled from upload, or type)</span></label>
<textarea id="yt_cookie" rows="3" placeholder="__Secure-3PAPISID=...; SAPISID=...; ..."></textarea>
<div class="row"><div><label>New YTM playlist title</label><input id="pl_title" value="black b1ll (from spotify)"></div>
<div style="flex:0 0 170px"><label>Privacy</label><select id="privacy"><option>PRIVATE</option><option>PUBLIC</option><option>UNLISTED</option></select></div></div>
</div>
<div class="btns"><button id="go">1-CLICK TRANSFER →</button><button id="step1" type="button">1) load spotify only</button></div>
<div class="card"><div id="progrow"><span id="spin"></span><span id="prog">idle.</span></div><div id="bar"><div id="fill"></div></div><div id="log">ready. 1-click = fetch spotify → search ytm → create playlist. No dev keys. Cookies stay localhost-only.</div></div>
<script>
const logEl=document.getElementById('log'),progEl=document.getElementById('prog'),spinEl=document.getElementById('spin'),barEl=document.getElementById('bar'),fillEl=document.getElementById('fill');
const follow=()=>{logEl.scrollTop=logEl.scrollHeight;};
const log=(m)=>{logEl.textContent+=m+"\n";requestAnimationFrame(follow);follow();};
const workOn=(label)=>{spinEl.classList.add('on');barEl.classList.add('live');document.getElementById('go').disabled=true;document.getElementById('step1').disabled=true;if(label)progEl.textContent=label;};
const workOff=(label)=>{spinEl.classList.remove('on');barEl.classList.remove('live');document.getElementById('go').disabled=false;document.getElementById('step1').disabled=false;if(label)progEl.textContent=label;};
const prog=(m)=>{progEl.textContent=m;};
const setBar=(done,total)=>{fillEl.style.width=(total?Math.round(100*done/total):0)+'%';};
const setAutoTitle=(name)=>{const auto=`${name} (from spotify)`;const el=document.getElementById('pl_title');
 if(!el.value.trim()||el.value===window._autoTitle||el.value==='black b1ll (from spotify)')el.value=auto;window._autoTitle=auto;};
function guessTarget(fname,text){const n=(fname||'').toLowerCase(),t=String(text||'').slice(0,4000);
 let yt=0,sp=0;
 if(n.includes('youtube'))yt+=3; if(n.includes('music.youtube'))yt+=3; if(n.includes('ytm'))yt+=2;
 if(n.includes('spotify'))sp+=3; if(n.includes('open.spotify'))sp+=3;
 if(t.includes('SAPISID'))yt+=4; if(t.includes('__Secure-3PAPISID'))yt+=4; if(t.includes('music.youtube'))yt+=2;
 if(t.includes('sp_dc'))sp+=4; if(t.includes('sp_key'))sp+=4; if(t.includes('open.spotify'))sp+=2; if(t.includes('spotify'))sp+=1;
 if(yt>sp)return 'yt'; if(sp>yt)return 'sp'; return 'unknown';}
document.getElementById('cookie_files').onchange=()=>{const files=[...document.getElementById('cookie_files').files];if(!files.length)return;
 files.forEach(f=>{const r=new FileReader();r.onload=()=>{const text=String(r.result||'').trim();const g=guessTarget(f.name,text);
  let field=g==='yt'?'yt_cookie':g==='sp'?'sp_cookie':(!document.getElementById('sp_cookie').value?'sp_cookie':!document.getElementById('yt_cookie').value?'yt_cookie':'sp_cookie');
  document.getElementById(field).value=text;
  log(`loaded ${f.name} (${text.length} chars) → ${field==='yt_cookie'?'YouTube':'Spotify'}`);};r.readAsText(f);});};
async function post(p,b,ms=25000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:c.signal});return r.json();}finally{clearTimeout(t);}}
document.getElementById('step1').onclick=async()=>{
 document.getElementById('log').textContent=''; workOn('loading spotify…'); setBar(0,1);
 const r=await post('/api/spotify',{url:sp_url.value,spotify_cookie:sp_cookie.value});
 if(!r.ok){log('SPOTIFY FAIL: '+r.error);workOff('failed.');return;} log(`SPOTIFY OK: ${r.playlist_name} — ${r.tracks.length} tracks`);
 setAutoTitle(r.playlist_name);
 r.tracks.slice(0,5).forEach(t=>log(` - ${t.title} — ${t.artist}`)); setBar(1,1); workOff('spotify loaded.');
 r.tracks.slice(0,5).forEach(t=>log(` - ${t.title} — ${t.artist}`));
 window._tracks=r.tracks; window._plname=r.playlist_name;
};
document.getElementById('go').onclick=async()=>{
 document.getElementById('log').textContent=''; workOn('1/3 fetching spotify…'); setBar(0,100);
 log('1/3 fetching spotify (keyless embed, + your cookie if given)…');
 let r=await post('/api/spotify',{url:sp_url.value,spotify_cookie:sp_cookie.value});
 if(!r.ok){log('SPOTIFY FAIL: '+r.error); if(r.hint)log('DIAGNOSIS ['+(r.kind||'?')+']: '+r.hint); workOff('failed.');return;}
 const tracks=r.tracks; log(`SPOTIFY OK: ${r.playlist_name} — ${tracks.length} tracks`); setAutoTitle(r.playlist_name); setBar(2,100);
 log('2/3 searching ytm (parallel batches of 10)…');
 const vids=[]; const CHUNK=10;
 for(let base=0;base<tracks.length;base+=CHUNK){const slice=tracks.slice(base,base+CHUNK);
  const done=Math.min(base+CHUNK,tracks.length);
  prog(`${done}/${tracks.length} searching: batch ${Math.floor(base/CHUNK)+1}/${Math.ceil(tracks.length/CHUNK)}…`); setBar(done,tracks.length);
  let b=null;
  try{b=await post('/api/search-batch',{queries:slice.map(t=>`${t.title} ${t.artist}`),workers:8},60000);}
  catch(e){log(` batch ${base/CHUNK+1} ERR: ${e.name==='AbortError'?'timeout 60s, skipped':e}`);continue;}
  if(!b.ok&&(b.kind==='throttle'||b.kind==='transient')){log(` batch ${base/CHUNK+1} ${b.kind}: ${b.hint} retrying…`);await new Promise(r=>setTimeout(r,2500));
   try{b=await post('/api/search-batch',{queries:slice.map(t=>`${t.title} ${t.artist}`),workers:4},60000);}catch(e){log(` batch retry ERR: ${e}`);continue;}}
  if(!b.ok){if(b.kind==='auth'||b.kind==='parse'){log(` batch FATAL [${b.kind}]: ${b.hint}`);workOff(`stopped: ${b.kind}.`);return {fatal:true};}log(` batch ${base/CHUNK+1} FAIL: ${b.error}`);continue;}
  b.results.forEach((s,k)=>{const t=slice[k],i=base+k;
   if(s.ok){vids.push(s.videoId); log(` [${i+1}/${tracks.length}] ${t.title} → ${s.videoId} (${s.title})`);}
   else log(` [${i+1}] MISS ${t.title}: ${s.error}`);});
 }
 prog(`MATCHED ${vids.length}/${tracks.length}`); setBar(vids.length,tracks.length);
 log(`MATCHED ${vids.length}/${tracks.length}`);
 if(!yt_cookie.value.trim()){log('3/3 SKIPPED create — no YTM cookie. Paste/type or load file, then click again.');window._vids=vids;workOff(`matched ${vids.length}/${tracks.length} — waiting for YTM cookie.`);return;}
 log('3/3 creating ytm playlist (auth = YOUR cookie only)…'); prog('3/3 creating playlist…');
 const c=await post('/api/create-playlist',{yt_cookie:yt_cookie.value,title:pl_title.value||r.playlist_name,description:'imported from '+sp_url.value,videoIds:vids,privacy:privacy.value});
 if(!c.ok){log('CREATE FAIL: '+c.error); if(c.hint)log('DIAGNOSIS ['+(c.kind||'?')+']: '+c.hint); workOff('create failed.');return;}
 setBar(tracks.length,tracks.length); workOff('done.');
 log('DONE: '+c.url);
};
</script></body></html>
