<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sp2yt — keyless spotify→ytmusic (personal use)</title>
<style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;max-width:720px;margin:0 auto;padding:32px 20px 0;background:radial-gradient(1200px 400px at 50% -80px,#1f5133 0%,#141417 60%);color:#e8e8ea;line-height:1.45;min-height:100vh}
h2{margin:0 0 4px;font-size:22px;letter-spacing:.2px}
h2 .dot{color:#1db954}
p.sub{color:#a9a9b2;margin:0 0 20px;font-size:14px}
.card{background:rgba(29,29,34,.96);border:1px solid #2c2c34;border-radius:12px;padding:16px;margin:0 0 14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
label{display:block;font-size:13px;font-weight:600;color:#cfcfd8;margin:12px 0 6px}
label:first-child{margin-top:0}
.hint{font-weight:400;color:#8e8e98;font-size:12px}
input[type=text],input:not([type]),textarea,select{width:100%;max-width:100%;padding:9px 10px;margin:0;background:#101014;color:#e8e8ea;border:1px solid #3a3a44;border-radius:7px;font-size:13px}
textarea{display:block;resize:vertical;min-height:56px;overflow:auto}
input[type=file]{width:100%;max-width:100%;margin:8px 0 0;padding:0;font-size:12px;color:#a9a9b2;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:12px}
.row>div{flex:1;min-width:0}
.btns{display:flex;gap:10px;margin:14px 0}
button{flex:1;padding:12px;font-size:15px;font-weight:700;border:0;border-radius:10px;cursor:pointer;transition:transform .06s,filter .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.98)}
button:disabled{filter:grayscale(.6) brightness(.7);cursor:wait}
#go{background:linear-gradient(180deg,#23d664,#159a46);color:#fff;box-shadow:0 4px 16px rgba(29,185,84,.35);width:100%}
#step1{background:#33333b;color:#fff}
#log{background:#0c0f0c;color:#7dffa8;border:1px solid #2c2c34;border-radius:8px;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:160px;overflow-y:auto;overflow-x:hidden;margin:10px 0 0}
#progrow{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;color:#ffd866;margin:0}
#spin{width:14px;height:14px;flex:0 0 14px;border:2px solid #3a3a44;border-top-color:#1db954;border-radius:50%;display:none}
#spin.on{display:inline-block;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#bar{height:10px;background:#101014;border:1px solid #3a3a44;border-radius:6px;overflow:hidden;margin:8px 0 0}
#fill{height:100%;width:0%;background:#1db954;transition:width .3s}
#bar.live #fill{background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:16px 16px;animation:slide .6s linear infinite}
@keyframes slide{to{background-position:16px 0}}
#plcard{display:none;margin:10px 0 0;padding:10px 12px;border:1px solid #1db954;border-radius:8px;background:#0e1a12;font-size:13px}
#plcard.show{display:block}
#plcard a{color:#1db954;word-break:break-all}
#rows{list-style:none;margin:10px 0 0;padding:0;max-height:320px;overflow-y:auto;font-size:12px}
#rows li{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid #222}
#rows .n{flex:0 0 40px;color:#8e8e98}
#rows .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rows .v{flex:0 0 90px;color:#8e8e98;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:0 0 auto;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;background:#33333b;color:#cfcfd8}
.chip.matched{background:#123a22;color:#7dffa8}.chip.landed{background:#123a22;color:#7dffa8}
.chip.appending{background:#3a2f10;color:#ffd866}.chip.skipped{background:#33333b;color:#a9a9b2}
.chip.refused{background:#3a1515;color:#ff8a8a}.chip.missing{background:#3a1515;color:#ff8a8a}
#newbtn{display:none;margin:8px auto 0;padding:6px 14px;font-size:12px;background:#33333b;color:#fff}
#showing{font-size:11px;color:#8e8e98;margin:6px 0 0}
details{margin:0 0 14px}
details summary{cursor:pointer;font-size:13px;font-weight:700;color:#cfcfd8}
</style></head><body>
<h2><span class="dot">●</span> sp2yt — 1-click, keyless, cookies are yours</h2>
<p class="sub">Paste playlist + your cookies. Nothing leaves your machine except direct Spotify / YT Music calls.</p>
<div class="card">
<label>Spotify playlist URL</label>
<input id="sp_url" value="" placeholder="paste playlist link — title fills in">
<label>Load cookies <span class="hint">(one upload — select both .txt files, auto-sorts Spotify vs YouTube)</span></label>
<input type="file" id="cookie_files" accept=".txt,text/plain,*/*" multiple>
<div class="row"><div><label>New YTM playlist title</label><input id="pl_title" value="" placeholder="auto from link"></div>
<div style="flex:0 0 64px"><label>Cover</label><img id="cover" alt="" style="width:56px;height:56px;border-radius:8px;object-fit:cover;display:none;border:1px solid #3a3a44"></div>
<div style="flex:0 0 170px"><label>Privacy</label><select id="privacy"><option>PRIVATE</option><option>PUBLIC</option><option>UNLISTED</option></select></div></div>
</div>
<div class="btns"><button id="go">Transfer to YouTube Music</button></div>
<div class="card"><div id="progrow"><span id="spin"></span><span id="prog">idle.</span></div><div id="bar"><div id="fill"></div></div><div id="plcard"></div><ol id="rows"></ol><button id="newbtn" type="button"></button><div id="showing"></div></div>
<details><summary>advanced</summary><div class="card" style="margin-top:10px">
<label>YouTube Music cookie <span class="hint">(the only login you need — auto-filled from upload, or type)</span></label>
<textarea id="yt_cookie" rows="3" placeholder="__Secure-3PAPISID=...; SAPISID=...; ..."></textarea>
<div style="margin:6px 0 0"><button id="forget" type="button" style="flex:none;padding:4px 12px;font-size:12px;background:#33333b;color:#fff">forget saved cookies</button> <span id="latchstat" style="font-size:12px;color:#8e8e98"></span></div>
<div style="margin:6px 0 0;display:flex;gap:8px"><input id="watchdir" placeholder="extra folder to watch (optional)" style="flex:1"><button id="watchsave" type="button" style="flex:none;padding:4px 12px;font-size:12px;background:#33333b;color:#fff">watch</button></div>
<div id="watchlist" style="font-size:12px;color:#8e8e98"></div>
<div style="display:flex;gap:10px;margin-top:10px"><button id="step1" type="button" style="font-size:12px;padding:8px">load spotify only (dev)</button><button id="copylog" type="button" style="font-size:12px;padding:8px">copy rows</button></div>
<div id="log">ready. Transfer = fetch spotify → search ytm → create playlist. No dev keys. Cookies stay localhost-only.</div>
</div></details>
<script>
const logEl=document.getElementById('log'),progEl=document.getElementById('prog'),spinEl=document.getElementById('spin'),barEl=document.getElementById('bar'),fillEl=document.getElementById('fill');
const rowsEl=document.getElementById('rows'),newBtn=document.getElementById('newbtn'),showingEl=document.getElementById('showing'),plcard=document.getElementById('plcard');
const log=(m)=>{const lines=(logEl.textContent+m+"\n").split("\n");if(lines.length>100)logEl.textContent=lines.slice(-100).join("\n");else logEl.textContent+=m+"\n";logEl.scrollTop=logEl.scrollHeight;};
const workOn=(label)=>{spinEl.classList.add('on');barEl.classList.add('live');window._busy=true;document.getElementById('go').disabled=true;if(label)progEl.textContent=label;};
const workOff=(label)=>{spinEl.classList.remove('on');barEl.classList.remove('live');window._busy=false;document.getElementById('go').disabled=false;if(label)progEl.textContent=label;};
const setBarStrict=(pct)=>{pct=Math.max(0,Math.min(100,pct));window._maxBar=Math.max(window._maxBar||0,pct);fillEl.style.width=window._maxBar+'%';};
const setAutoTitle=(name,cover)=>{const auto=String(name||'').trim();const el=document.getElementById('pl_title');
 if(!el.value.trim()||el.value===window._autoTitle||/ \(from spotify\)$/.test(el.value))el.value=auto;window._autoTitle=auto;
 const im=document.getElementById('cover'); if(cover){im.src=cover;im.style.display='block';}};
function guessTarget(fname,text){const n=(fname||'').toLowerCase(),t=String(text||'').slice(0,4000);
 let yt=0,sp=0;
 if(n.includes('youtube'))yt+=3; if(n.includes('music.youtube'))yt+=3; if(n.includes('ytm'))yt+=2;
 if(n.includes('spotify'))sp+=3; if(n.includes('open.spotify'))sp+=3;
 if(t.includes('SAPISID'))yt+=4; if(t.includes('__Secure-3PAPISID'))yt+=4; if(t.includes('music.youtube'))yt+=2;
 if(t.includes('sp_dc'))sp+=4; if(t.includes('sp_key'))sp+=4; if(t.includes('open.spotify'))sp+=2; if(t.includes('spotify'))sp+=1;
 if(yt>sp)return 'yt'; if(sp>yt)return 'sp'; return 'unknown';}
document.getElementById('cookie_files').onchange=()=>{const files=[...document.getElementById('cookie_files').files];if(!files.length)return;
 files.forEach(f=>{const r=new FileReader();r.onload=()=>{const text=String(r.result||'').trim();const g=guessTarget(f.name,text);
  if(g==='sp'){log(`loaded ${f.name} — spotify cookies not needed for public links, ignored.`);return;}
  yt_cookie.value=text;
  log(`loaded ${f.name} (${text.length} chars) → YouTube`);
  post('/api/check',{spotify_cookie:'',yt_cookie:text},30000).then(k=>{if(k.ok)log(`cookie check: ytm ${k.ytm.ok?'OK':'STALE — re-export!'}`);}).catch(()=>{});
  post('/api/latch',{spotify_cookie:'',yt_cookie:text}).catch(()=>{});
 };r.readAsText(f);});};
document.getElementById('forget').onclick=async()=>{await post('/api/forget',{}).catch(()=>{});
 yt_cookie.value='';document.getElementById('watchdir').value='';document.getElementById('watchlist').textContent='';
 document.getElementById('latchstat').textContent='vault cleared.';
 log('saved cookies + watch folder forgotten.');};
async function showWatch(){try{const w=await post('/api/watch',{},15000);
 if(w.ok)document.getElementById('watchlist').textContent='watching: '+w.dirs.join(' · ');}catch(e){}}
document.getElementById('watchsave').onclick=async()=>{const d=document.getElementById('watchdir').value.trim();
 if(!d)return; const w=await post('/api/watch',{extra:d}).catch(e=>({ok:false}));
 if(w&&w.ok){document.getElementById('watchlist').textContent='watching: '+w.dirs.join(' · ');log('watching extra folder.');}
 else log('watch failed: folder not found.');};
showWatch();
async function lastSession(){
 sp_url.value='';pl_title.value='';window._autoTitle='';
 try{const v=await post('/api/vault',{},15000);
  if(v.has_yt)yt_cookie.value=v.yt_cookie;
  document.getElementById('latchstat').textContent=v.has_yt?'cookies latched from last session.':'no saved cookies.';
  if(v.has_yt)log('latched YouTube cookie'+((v.refreshed||[]).some(x=>x.startsWith('yt'))?' (fresh file from disk)':' from last session')+'.');
 }catch(e){document.getElementById('latchstat').textContent='';}
}
lastSession();
const privacySel=document.getElementById('privacy');
(async()=>{try{
 const r=await fetch('/api/settings').then(r=>r.json());
 if(r.ok&&r.privacy&&[...privacySel.options].some(o=>o.value===r.privacy)){privacySel.value=r.privacy;}
 else{const lp=localStorage.getItem('sp2yt.privacy');
  if(lp&&[...privacySel.options].some(o=>o.value===lp)){privacySel.value=lp;
   fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({privacy:lp})}).catch(()=>{});}}
}catch(e){try{const lp=localStorage.getItem('sp2yt.privacy');
 if(lp&&[...privacySel.options].some(o=>o.value===lp))privacySel.value=lp;}catch(_){}}})();
privacySel.onchange=()=>{fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({privacy:privacySel.value})}).catch(()=>{});};
let detectToken=0,detectTimer=null;
document.getElementById('sp_url').addEventListener('input',()=>{clearTimeout(detectTimer);detectTimer=setTimeout(autoDetectTitle,600);});
async function autoDetectTitle(){
 if(window._busy)return;
 const u=document.getElementById('sp_url').value.trim();
 if(!/open\.spotify\.com\/playlist\/[A-Za-z0-9]+/.test(u))return;
 const my=++detectToken; progEl.textContent='detecting playlist title…';
 try{const r=await post('/api/spotify',{url:u,spotify_cookie:''},25000);
  if(my!==detectToken||!r.ok)return;
  setAutoTitle(r.playlist_name,r.cover_url);
  progEl.textContent=`detected: ${r.playlist_name} — ${r.tracks.length} of ${r.declared_total||r.tracks.length} tracks. Ready.`;
 }catch(e){}
}
async function post(p,b,ms=25000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:c.signal});return r.json();}finally{clearTimeout(t);}}
document.getElementById('copylog').onclick=async()=>{const rows=[...window._rowMap.values()].sort((a,b)=>a.i-b.i);
 const t=rows.map(r=>`${r.i}. ${r.title} — ${r.artist} [${r.videoId||'-'}] ${r.state}`).join("\n");
 try{await navigator.clipboard.writeText(t);progEl.textContent='rows copied ('+t.length+' chars).';}
 catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');progEl.textContent='rows copied ('+t.length+' chars).';}catch(_){progEl.textContent='copy failed — select manually.';}ta.remove();}};
document.getElementById('step1').onclick=async()=>{
 logEl.textContent=''; workOn('loading spotify…'); setBarStrict(0);
 const r=await post('/api/spotify',{url:sp_url.value,spotify_cookie:''});
 if(!r.ok){log('SPOTIFY FAIL: '+r.error);workOff('failed.');return;} log(`SPOTIFY OK: ${r.playlist_name} — ${r.tracks.length} of ${r.declared_total||r.tracks.length} tracks`);
 setAutoTitle(r.playlist_name,r.cover_url);
 r.tracks.slice(0,5).forEach(t=>log(` - ${t.title} — ${t.artist}`)); setBarStrict(100); workOff('spotify loaded.');
 window._tracks=r.tracks; window._plname=r.playlist_name;
};
// ---- live run model ----
window._rowMap=new Map(); window._since=0; window._pollTimer=null; window._fail=0; window._lastOk=Date.now(); window._maxBar=0; window._pendingNew=0; window._reconcile=0;
const phaseWord=(ph)=>({idle:'idle.',spotify:'Fetching Spotify…',search:'Searching YouTube Music…',create:'Creating playlist…',append:'Adding tracks…',verify:'Verifying…',done:'Done.',failed:'Failed.'}[ph]||ph);
function nearBottom(el){return (el.scrollHeight-el.scrollTop-el.clientHeight)<80;}
function renderPlcard(d){
 if(!d.created||!d.url){plcard.className='';plcard.innerHTML='';return;}
 const n=d.landed||0,m=d.sent||d.total||0;
 const head=d.existing?`Exists — ${n} of ${m} tracks from this playlist are on it`:`Playlist created — ${n} of ${m} added`;
 plcard.className='show';
 const a=document.createElement('a');a.href=d.url;a.textContent=d.url;a.target='_blank';a.rel='noopener';
 plcard.innerHTML='';const s=document.createElement('span');s.textContent=head+' ';
 plcard.appendChild(s);plcard.appendChild(a);
 if(d.summary){const sm=document.createElement('div');sm.style.cssText='color:#a9a9b2;font-size:12px;margin-top:4px';sm.textContent=d.summary;plcard.appendChild(sm);}
}
function renderRows(full){
 const all=[...window._rowMap.values()].sort((a,b)=>a.i-b.i);
 const total=all.length;
 const vis=all;
 showingEl.textContent='';
 const stick=nearBottom(rowsEl);
 rowsEl.innerHTML='';
 for(const r of vis){
  const li=document.createElement('li');
  const n=document.createElement('span');n.className='n';n.textContent=r.i;
  const t=document.createElement('span');t.className='t';t.textContent=`${r.title} — ${r.artist}`;
  const v=document.createElement('span');v.className='v';v.textContent=r.videoId||'';
  const c=document.createElement('span');c.className='chip '+r.state;c.textContent=r.state;
  li.append(n,t,v,c);rowsEl.appendChild(li);
 }
 if(stick)rowsEl.scrollTop=rowsEl.scrollHeight;
}
newBtn.onclick=()=>{rowsEl.scrollTop=rowsEl.scrollHeight;window._pendingNew=0;newBtn.style.display='none';};
function applyRun(d){
 window._since=d.seq;
 for(const r of (d.rows||[])){window._rowMap.set(r.i,r);}
 if((d.rows||[]).length&&!nearBottom(rowsEl)){window._pendingNew+=(d.rows||[]).length;newBtn.style.display='block';newBtn.textContent=window._pendingNew+' new ↓';}
 else if(nearBottom(rowsEl)){window._pendingNew=0;newBtn.style.display='none';}
 renderPlcard(d);
 // status line
 const tot=d.total||0, sent=d.sent||d.matched||0, dec=d.declared||tot;
 let msg=phaseWord(d.phase);
 if(d.phase==='search')msg=`Searching — ${d.matched} of ${dec} matched`;
 else if(d.phase==='append'||d.phase==='create')msg=`Adding tracks — ${d.landed} of ${sent||tot} on the playlist (${dec} declared)`;
 else if(d.phase==='verify')msg=`Verifying — ${d.landed} of ${sent||tot} on the playlist (${dec} declared)`;
 else if(d.phase==='done')msg=d.summary||(d.existing?`exists — ${d.landed} of ${sent} tracks from this playlist are on it`:`Done — ${d.landed} of ${sent} on the playlist`);
 else if(d.phase==='failed')msg=`Failed: ${d.error||'unknown'}`;
 else if(d.phase==='spotify')msg='Fetching Spotify…';
 progEl.textContent=msg;
 if(d.hint&&(d.phase==='failed'))log('DIAGNOSIS ['+(d.kind||'?')+']: '+d.hint);
 // progress bar monotonic
 let pct=0;
 const term=(d.landed||0)+(d.refused||0)+(d.missing||0)+(d.skipped||0);
 if(tot)pct=100*term/tot;
 if(d.phase==='search'&&tot)pct=Math.max(pct,100*((d.matched||0)+(d.skipped||0))/tot);
 if(!tot&&sent)pct=100*(d.landed||0)/sent;
 else if(tot&&d.phase==='spotify')pct=Math.max(pct,2);
 setBarStrict(pct);
 renderRows();
}
async function pollOnce(){
 let c=null,t=null;
 try{
  c=new AbortController();t=setTimeout(()=>c.abort(),10000);
  const r=await fetch('/api/run?since='+window._since,{signal:c.signal});
  const d=await r.json();
  window._fail=0;window._lastOk=Date.now();
  if(d.ok){
   if(d.phase==='done'){
    if(!window._reconcile){window._reconcile=1;applyRun(d);return;}
    applyRun(d);stopPoll();workOff(d.existing?`exists — ${d.landed} of ${d.sent} tracks from this playlist are on it`:`Done — ${d.landed} of ${d.sent} on the playlist`);
    log(d.existing?`EXISTS: ${d.url} — ${d.landed} of ${d.sent} tracks from this playlist are on it`:`DONE: ${d.url} — confirmed ${d.landed}/${d.sent} on YTM`);
    return;
   }
   window._reconcile=0;
   applyRun(d);
   if(d.phase==='failed'){stopPoll();workOff('failed.');log('FAILED: '+(d.error||'unknown'));if(d.hint)log('DIAGNOSIS ['+(d.kind||'?')+']: '+d.hint);}
   else workOn(null);
  }
 }catch(e){
  window._fail++;
  if(window._fail>=3){const s=Math.round((Date.now()-window._lastOk)/1000);progEl.textContent=`Server stopped answering ${s}s ago — the playlist link above may still be real.`;document.getElementById('go').disabled=false;window._busy=false;spinEl.classList.remove('on');barEl.classList.remove('live');}
 }finally{if(t)clearTimeout(t);}
}
function startPoll(){stopPoll();window._pollTimer=setInterval(pollOnce,700);}
function stopPoll(){if(window._pollTimer){clearInterval(window._pollTimer);window._pollTimer=null;}}
document.getElementById('go').onclick=async()=>{
 if(window._busy)return;
 const url=sp_url.value.trim();
 if(!url){progEl.textContent='paste a Spotify playlist URL first.';return;}
 if(!yt_cookie.value.trim()){progEl.textContent='need YTM cookie — upload or paste it in advanced.';return;}
 workOn('starting transfer…');
 post('/api/latch',{spotify_cookie:'',yt_cookie:yt_cookie.value}).catch(()=>{});
 let t;
 try{t=await fetch('/api/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,yt_cookie:yt_cookie.value,title:pl_title.value||'',privacy:privacy.value})}).then(r=>r.json());}
 catch(e){workOff('server did not answer — the playlist link shown stays valid; click again to re-attach if the run is alive.');log('transfer attempt failed ('+e+') — server did not answer; the playlist link shown stays valid. Click again to re-attach if the run is alive. Polling for truth…');startPoll();pollOnce();return;}
 if(!t.ok){if(t.run_id){workOn('still running on the server — re-attached; the playlist link shown stays valid.');log('transfer not started ('+(t.error||'unknown')+') — server did not answer for a new run; the playlist link shown stays valid; re-attached to the live run. Click again to re-attach if needed.');startPoll();pollOnce();}else{workOff(t.error||'transfer not started.');log('transfer not started ('+(t.error||'unknown')+').');}return;}
 window._rowMap=new Map();window._since=0;window._fail=0;window._lastOk=Date.now();window._maxBar=0;window._reconcile=0;window._pendingNew=0;newBtn.style.display='none';
 rowsEl.innerHTML='';showingEl.textContent='';plcard.className='';plcard.innerHTML='';fillEl.style.width='0%';
 log('transfer started ('+t.run_id+'). Polling every 700ms…');
 startPoll();pollOnce();
};
(async()=>{try{
 const c=new AbortController();const t=setTimeout(()=>c.abort(),10000);
 const r=await fetch('/api/run?since=0',{signal:c.signal});clearTimeout(t);
 const d=await r.json();
 if(d.ok&&d.run_id){
  for(const row of (d.rows||[]))window._rowMap.set(row.i,row);
  window._since=d.seq;renderPlcard(d);renderRows();
  if(['spotify','search','create','append','verify'].includes(d.phase)){applyRun({ ...d, rows:[] });window._since=d.seq;startPoll();}
  else if(d.phase==='done'||d.phase==='failed'){applyRun({ ...d, rows:[] });window._since=d.seq;workOff(d.phase==='done'?`Done — ${d.landed} of ${d.sent} on the playlist`:'failed.');}
 }
}catch(e){}})();
</script></body></html>
